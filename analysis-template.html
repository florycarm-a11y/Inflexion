.mega-icon{width:36px;height:36px;border-radius:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}

0%{background-position:0% 50%}
25%{background-position:100% 25%}
50%{background-position:100% 75%}
75%{background-position:0% 100%}
100%{background-position:0% 50%}
}
@keyframes hero-orb-float{
0%,100%{transform:translate(0,0) scale(1)}
33%{transform:translate(30px,-20px) scale(1.1)}
66%{transform:translate(-20px,15px) scale(0.95)}

.hero-dynamic{
background:linear-gradient(135deg,#17100E 0%,#241813 25%,#42301E 50%,#1C1310 75%,#17100E 100%);
background-size:400% 400%;

}
.hero-dynamic::before{
content:'';
position:absolute;
top:-50%;left:-50%;
width:200%;height:200%;
background:radial-gradient(ellipse at 30% 20%,rgba(142,36,36,.14) 0%,transparent 50%),

.hero-dark{background-color:var(--chrome-ground);color:var(--chrome-text)}
.hero-dark h1,.hero-dark h2,.hero-dark .display-text{color:#FFFFFF}

.featured-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--editorial-accent);transform:scaleY(0);transition:transform .3s ease;transform-origin:top}
.featured-card:hover::before{transform:scaleY(1)}
.hero-glow{position:absolute;top:-120px;right:-80px;width:500px;height:500px;background:radial-gradient(circle,rgba(142,36,36,.06) 0%,transparent 70%);pointer-events:none}

html,body{overflow-x:hidden}

button,a[href]:not(.prose a){min-height:44px;min-width:44px}

<body data-design-regime="editorial">
<a href="#main-content" class="skip-link" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;z-index:9999;padding:8px 16px;background:var(--chrome-ground);color:var(--chrome-text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;text-decoration:none;border-radius:0 0 4px 0;" onfocus="this.style.position='fixed';this.style.left='0';this.style.top='0';this.style.width='auto';this.style.height='auto';this.style.overflow='visible';" onblur="this.style.position='absolute';this.style.left='-9999px';this.style.width='1px';this.style.height='1px';this.style.overflow='hidden';">Aller au contenu principal</a>
<div id="app"></div>
<script src="nav-config.js"></script>
<script type="module">
/* ─── GABARIT D'ARTICLE — MODE D'EMPLOI ────────────────────────────────
 *
 * Pour créer un nouvel article :
 * 1. Dupliquer ce fichier sous `analyse-<slug>.html` et adapter <title>
 *    et <meta name="description"> dans le <head>.
 * 2. Remplacer toutes les valeurs de ARTICLE ci-dessous (aucune clé ne
 *    doit rester vide). `date`/`duree`/scores sont des exemples à
 *    remplacer, pas des valeurs par défaut à conserver.
 * 3. Écrire le corps dans SECTIONS avec Section()/SousTitre()/P() :
 *    - Section({rang, romain, titre}, …) : `romain` (ex. 'I','II') numérote
 *      la section dans le rail de progression ; `romain:null` pour une
 *      section non numérotée (ex. la thèse centrale, en tête de dossier).
 *      `rang` est un identifiant stable (ancre #section-N) — il doit être
 *      unique et croissant, indépendamment de la numérotation romaine.
 *    - SousTitre(null, '…') pour un sous-titre à l'intérieur d'une section.
 *    - P(props, …enfants) pour un paragraphe. Les sources apparaissent
 *      dans la gouttière en regard du texte via `P({sources:['Nom A','Nom B']}, …)`
 *      — JAMAIS citées dans le texte lui-même. `P(null, …)` si le
 *      paragraphe n'a pas de source directe (transition, synthèse…).
 *    - `h(...)` (importé de article-shell.js) reste disponible pour du
 *      HTML ponctuel non couvert par ces trois helpers (ex. un encart
 *      `.insight-box`), voir l'exemple dans la section II ci-dessous.
 * 4. Ne pas toucher à assets/article-shell.js ni assets/article-model.js :
 *    ils sont partagés par tous les articles.
 *
 * ARTICLE.semplice.dimensions doit garder ses 8 clés (S,E,M,P,L,I,C,Ee).
 * ARTICLE.scenarios doit garder son `.map(s=>({...s,proba:parseProbability(s.fourchette)}))` :
 * la probabilité numérique ne doit jamais être écrite en dur, uniquement
 * dérivée de `fourchette` par parseProbability.
 * ARTICLE.matrice[].niveau doit valoir 'CRITIQUE', 'ÉLEVÉ', 'MODÉRÉ' ou
 * 'OPPORTUNITÉ' (mot-clé exact) : ces couleurs de palier sont fournies par
 * le squelette, il ne faut ni les redéfinir ni inventer un 5ᵉ mot-clé.
 * ────────────────────────────────────────────────────────────────────── */

import { h, Section, SousTitre, P, renderArticle } from './assets/article-shell.js'
import { parseProbability } from './assets/article-model.js'

// ─── ARTICLE ─────────────────────────────────────

const ARTICLE={
categorie:'CATÉGORIE D’EXEMPLE',
zone:'Zone géographique d’exemple',
titre:'Titre principal de l’analyse',
chapo:'Chapô d’exemple : une à deux phrases qui posent l’enjeu central et donnent envie de lire la suite. À remplacer entièrement.',
auteur:'Inflexion Research',
date:'JJ mois AAAA',
duree:'XX min de lecture',
semplice:{
risque:4,
opportunite:3,
palier:'Modéré',
tendance:'→',
dimensions:[
{cle:'S',nom:'Social',risque:4,opp:3,tendance:'→'},
{cle:'E',nom:'Économique',risque:4,opp:3,tendance:'↑'},
{cle:'M',nom:'Militaire',risque:3,opp:2,tendance:'→'},
{cle:'P',nom:'Politique',risque:5,opp:3,tendance:'↑'},
{cle:'L',nom:'Légal',risque:3,opp:3,tendance:'→'},
{cle:'I',nom:'Intelligence artificielle',risque:4,opp:5,tendance:'↑'},
{cle:'C',nom:'Cyber',risque:5,opp:2,tendance:'↑'},
{cle:'Ee',nom:'Environnemental',risque:3,opp:3,tendance:'↓'},
],
},
// Le rang est porté par la position dans le tableau ; l'intitulé complet
// (« Scénario N — … ») est reconstitué par l'appareil critique. `fourchette`
// garde la probabilité telle qu'affichée ; `proba`, son milieu numérique,
// sert aux largeurs de la page de garde — jamais saisi en dur.
scenarios:[
{titre:'Scénario favorable',fourchette:'30-35 %',
 texte:'Exemple de scénario favorable : décrire en deux ou trois phrases la trajectoire qui mène à ce dénouement, avec les faits déclencheurs.',
 impact:'exemple d’impact concret pour les décideurs si ce scénario se réalise.'},
{titre:'Scénario central',fourchette:'40-45 %',
 texte:'Exemple de scénario central (le plus probable) : décrire le statu quo prolongé ou la trajectoire la plus vraisemblable.',
 impact:'exemple d’impact concret associé au scénario central.'},
{titre:'Scénario défavorable',fourchette:'20-25 %',
 texte:'Exemple de scénario défavorable : décrire la trajectoire de dégradation et son déclencheur principal.',
 impact:'exemple d’impact concret en cas de matérialisation du risque.'},
].map(s=>({...s,proba:parseProbability(s.fourchette)})),
chiffres:[
{valeur:'XX %',libelle:'Libellé du premier chiffre clé'},
{valeur:'XX Mds €',libelle:'Libellé du deuxième chiffre clé'},
{valeur:'X.X/7',libelle:'Libellé du troisième chiffre clé'},
{valeur:'4/7',libelle:'Score SEMPLICE — Modéré'},
],
retenir:'Exemple de synthèse « à retenir » : trois à cinq phrases qui résument la thèse de l’article, ses chiffres clés et ses implications pour les décideurs. À remplacer par la synthèse réelle.',
bibliographie:[
{nom:'Source A',url:'https://exemple.org/source-a',note:'Note explicative sur ce qu’apporte la Source A'},
{nom:'Source B',url:'https://exemple.org/source-b',note:'Note explicative sur ce qu’apporte la Source B'},
{nom:'Source C',url:'https://exemple.org/source-c',note:'Note explicative sur ce qu’apporte la Source C'},
],
lectureScore:'Exemple de lecture du score composite : expliquer quelles dimensions tirent le risque ou l’opportunité vers le haut ou le bas, et pourquoi.',
matrice:[
{secteur:'Secteur A',niveau:'CRITIQUE',reco:'Recommandation associée au niveau CRITIQUE.'},
{secteur:'Secteur B',niveau:'ÉLEVÉ',reco:'Recommandation associée au niveau ÉLEVÉ.'},
{secteur:'Secteur C',niveau:'MODÉRÉ',reco:'Recommandation associée au niveau MODÉRÉ.'},
{secteur:'Secteur D',niveau:'OPPORTUNITÉ',reco:'Recommandation associée au niveau OPPORTUNITÉ.'},
],
alertes:[
{signal:'Exemple de signal d’alerte n°1',lecture:'exemple de lecture associée'},
{signal:'Exemple de signal d’alerte n°2',lecture:'exemple de lecture associée'},
{signal:'Exemple de signal d’alerte n°3',lecture:'exemple de lecture associée'},
],
amf:'Cette analyse est fournie à titre informatif et ne constitue en aucun cas un conseil en investissement, une recommandation personnalisée ou une incitation à acheter ou vendre des instruments financiers. Les performances passées ne préjugent pas des performances futures. Tout investissement comporte des risques de perte en capital. Les évaluations de risque SEMPLICE reflètent une appréciation à date et ne constituent pas une garantie.',
sourcesMeta:'XX+ sources — fiabilité A/B',
sourcesNote:'Collecte OSINT multi-sources. Classification fiabilité A/B/C. Mis à jour le JJ mois AAAA.',
articlesLies:[
{titre:'Titre de l’article lié n°1',href:'analyse-exemple-1.html',img:'https://images.unsplash.com/photo-1495020689067-958852a7765e?w=300&h=200&fit=crop',cat:'geopolitique',catLabel:'Géopolitique'},
{titre:'Titre de l’article lié n°2',href:'analyse-exemple-2.html',img:'https://images.unsplash.com/photo-1495020689067-958852a7765e?w=300&h=200&fit=crop',cat:'marches',catLabel:'Marchés'},
{titre:'Titre de l’article lié n°3',href:'analyse-exemple-3.html',img:'https://images.unsplash.com/photo-1495020689067-958852a7765e?w=300&h=200&fit=crop',cat:'crypto',catLabel:'Crypto'},
],
}

// ─── CORPS DU DOSSIER ──────────────────────────────────

const SECTIONS=[

// Section non numérotée (romain:null) — typiquement la thèse centrale,
// en ouverture du corps, avant la première partie numérotée.
Section({rang:1,romain:null,titre:'Thèse centrale'},
   P(null,
    'Exemple de paragraphe sans source directe (',h('strong',null,'texte en emphase'),' via h(\'strong\',null,…)) — utile pour une thèse, une transition ou une synthèse qui ne cite pas de donnée chiffrée précise. Ce paragraphe n’a pas de prop `sources` : la gouttière reste vide, c’est un cas normal, pas une omission.'
   ),
),

// Première section numérotée.
Section({rang:2,romain:'I',titre:'Première partie'},

   SousTitre(null,'Exemple de sous-titre'),
   P({sources:['Source A','Source B']},
    'Exemple de paragraphe ',h('strong',null,'avec sources'),' : la prop `sources` liste les références qui alimentent l’affirmation. Elles s’affichent dans la gouttière, en regard du texte — jamais entre parenthèses ni en note de bas de page dans le corps du texte.'
   ),
   P(null,
    'Second exemple de paragraphe dans la même partie, cette fois sans source directe — une phrase de commentaire ou de mise en perspective qui prolonge le paragraphe précédent.'
   ),

   h('div',{className:'insight-box not-prose'},
    h('div',{className:'text-[11px] font-semibold uppercase tracking-wider text-[var(--editorial-accent)] mb-2'},'Exemple d’encart'),
    h('p',{className:'text-sm text-[var(--text-secondary)] leading-relaxed'},
     'Encadré optionnel construit avec `h(...)` directement (variantes disponibles : aucune classe, `alert`, ou `gold`, en plus de `insight-box`) pour un point clé, un signal critique ou une fenêtre d’opportunité à mettre en avant visuellement.'
    )
   ),
),

// Seconde section numérotée.
Section({rang:3,romain:'II',titre:'Deuxième partie'},

   SousTitre(null,'Autre exemple de sous-titre'),
   P({sources:['Source C']},
    'Exemple de paragraphe illustrant une seconde partie numérotée, avec une source unique cette fois — la prop `sources` accepte une liste d’une ou plusieurs entrées.'
   ),
),
]

// ─── MONTAGE ─────────────────────────────────────

renderArticle(ARTICLE, SECTIONS)
</script>
<script src="scroll-reveal.js"></script>
