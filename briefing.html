<script type="module">
import React,{useState,useEffect,useRef,useCallback} from 'https://esm.sh/react@18.2.0'
import{createRoot}from 'https://esm.sh/react-dom@18.2.0/client'

var h=React.createElement
var MEGA_NAV=window.MEGA_NAV

// ─── HOOKS ──────────────────────────────────────────────────────────────────

function useInView(opts){
var ref=useRef(null)
var vis=useState(false)
var visible=vis[0],setVisible=vis[1]
useEffect(function(){
if(!ref.current)return
var io=new IntersectionObserver(function(entries){
if(entries[0].isIntersecting){setVisible(true);if(!(opts&&opts.repeat))io.disconnect()}
else if(opts&&opts.repeat)setVisible(false)
},{threshold:(opts&&opts.threshold)||0.12,rootMargin:(opts&&opts.rootMargin)||'0px'})
io.observe(ref.current)
return function(){io.disconnect()}
},[])
return[ref,visible]
}

function useActiveSection(ids){
var st=useState('')
var active=st[0],setActive=st[1]
useEffect(function(){
var observer=new IntersectionObserver(function(entries){
entries.forEach(function(e){
if(e.isIntersecting)setActive(e.target.id)
})
},{threshold:0.3,rootMargin:'-80px 0px -50% 0px'})
ids.forEach(function(id){
var el=document.getElementById(id)
if(el)observer.observe(el)
})
return function(){observer.disconnect()}
},[ids.join(',')])
return active
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────

function Navigation(){
const[open,setOpen]=useState(false)
const[scrolled,setScrolled]=useState(false)
useEffect(()=>{
const fn=()=>setScrolled(window.scrollY>60)
window.addEventListener('scroll',fn,{passive:true})
return()=>window.removeEventListener('scroll',fn)
},[])
useEffect(()=>{
if(open){document.body.classList.add('menu-open')}else{document.body.classList.remove('menu-open')}
return()=>document.body.classList.remove('menu-open')
},[open])
return h('div',null,
 h('div',{className:'fixed top-0 left-0 right-0 z-[51] h-[3px] bg-[var(--editorial-accent)]'}),
 h('header',{className:`fixed top-[3px] left-0 right-0 z-50 transition-all duration-300 ${scrolled?'nav-scrolled':'bg-transparent'}`},
  h('div',{className:'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8'},
   h('div',{className:'flex items-center justify-between h-16'},
    h('a',{href:'index.html',className:'flex items-center gap-2'},
     h('img',{src:'logo-header.png',alt:'Inflexion',className:'h-10 sm:h-[50px] md:h-[65px] w-auto',style:{filter:'brightness(10) saturate(0)'}})
    ),
    h('nav',{className:'hidden md:flex items-center gap-1'},
     ...MEGA_NAV.map((cat,ci)=>
      h('div',{key:ci,className:'mega-trigger'},
       h('span',{className:'nav-link px-3 py-2 text-sm font-medium transition-colors cursor-default select-none text-[#9AA0A4] hover:text-[#E8E4D8]'},cat.label),
       h('div',{className:'mega-menu bg-[#FFFFFF] border border-[#4C5052] p-5 shadow-[0_6px_18px_rgba(14,16,18,.18)]'},
        h('div',{className:'grid gap-1'},
         ...cat.children.map((item,ii)=>
          h('a',{key:ii,href:item.href,className:'mega-item flex items-start gap-3 px-3 py-2.5 rounded-xl no-underline'},
           h('span',{className:'mega-icon bg-[#EDEBE4] text-[#101214]'},item.icon),
           h('span',{className:'flex flex-col'},
            h('span',{className:'text-sm font-semibold text-[#101214]'},item.label),
            h('span',{className:'text-xs text-[#4C5052] mt-0.5'},item.desc)
           )
          )
         )
        )
       )
      )
     ),
     h('a',{href:'premium.html',className:'ml-4 px-4 py-2 bg-[var(--editorial-accent)] hover:bg-[#6E1B1B] text-[#F5EDE6] font-semibold text-sm transition-colors'},'R\u00e9server un diagnostic')
    ),
    h('button',{className:`hamburger md:hidden p-2 ${open?'open':''}`,'aria-label':'Menu','aria-expanded':open,onClick:()=>setOpen(!open)},
     h('span'),h('span'),h('span')
    )
   )
  )
 ),
 h('div',{className:`mobile-overlay fixed inset-0 z-[60] flex flex-col ${open?'open':''}`,style:{backgroundColor:'var(--chrome-ground)'}},
  h('div',{className:'flex items-center justify-between px-6 pt-5 pb-4 flex-shrink-0'},
   h('img',{src:'logo-header.png',alt:'Inflexion',className:'h-8 w-auto',style:{filter:'brightness(10) saturate(0)'}}),
   h('button',{onClick:()=>setOpen(false),className:'w-11 h-11 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors','aria-label':'Fermer'},
    h('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.5,strokeLinecap:'round',className:'text-white'},h('path',{d:'M18 6L6 18M6 6l12 12'}))
   )
  ),
  h('div',{className:'flex-1 overflow-y-auto px-6 pt-2 pb-4'},
   ...MEGA_NAV.map((cat,ci)=>[
    h('p',{key:'h'+ci,className:'menu-item text-[11px] uppercase tracking-[.2em] text-white/40 font-semibold mb-3'+(ci>0?' mt-8':''),style:{animationDelay:`${0.05+ci*0.18}s`}},cat.label),
    ...cat.children.map((item,ii)=>
     h('a',{key:'m'+ci+'-'+ii,href:item.href,onClick:()=>setOpen(false),className:'menu-item flex items-center gap-3 py-3 text-white/90 hover:text-white transition-colors border-b border-white/8',style:{animationDelay:`${0.08+ci*0.18+ii*0.05}s`}},
      h('span',{className:'text-base'},item.icon),
      h('span',{className:'text-base sm:text-lg md:text-[20px] font-medium'},item.label)
     )
    )
   ]).flat()
  ),
  h('div',{className:'px-6 pt-4 pb-20 flex-shrink-0'},
   h('a',{href:'premium.html',onClick:()=>setOpen(false),className:'menu-item block w-full text-center px-6 py-3.5 bg-white/10 hover:bg-white/15 text-white font-semibold transition-colors text-base',style:{animationDelay:'0.85s'}},'R\u00e9server un diagnostic')
  )
 )
)
}

// ─── REVEAL WRAPPER ─────────────────────────────────────────────────────────

function Reveal(props){
var r=useInView({threshold:0.08})
var ref=r[0],visible=r[1]
return h('div',{ref:ref,className:'reveal-section'+(visible?' visible':'')+(props.className?' '+props.className:''),style:props.delay?{transitionDelay:props.delay+'s'}:undefined},props.children)
}

// ─── HERO ────────────────────────────────────────────────────────────────────

function BriefingHero(props){
var briefing=props.briefing
var heroRef=useRef(null)
useEffect(function(){
var el=heroRef.current
if(!el)return
var onScroll=function(){
var r=el.getBoundingClientRect()
var p=Math.max(0,Math.min(1,-r.top/(r.height||1)))
var content=el.querySelector('.hero-content')
if(content){content.style.transform='translateY('+p*40+'px)';content.style.opacity=1-p*0.6}
}
window.addEventListener('scroll',onScroll,{passive:true})
return function(){window.removeEventListener('scroll',onScroll)}
},[])

var dateStr=''
if(briefing&&briefing.date){
try{dateStr=new Date(briefing.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){}
}

var sentimentLabel=briefing&&briefing.sentiment_global?briefing.sentiment_global:'neutre'
var sentimentColor=sentimentLabel==='haussier'?'#10b981':sentimentLabel==='baissier'?'#ef4444':sentimentLabel==='mixte'?'#eab308':'#94a3b8'
var sentimentBg=sentimentLabel==='haussier'?'rgba(16,185,129,.15)':sentimentLabel==='baissier'?'rgba(239,68,68,.15)':sentimentLabel==='mixte'?'rgba(234,179,8,.15)':'rgba(148,163,184,.15)'

var signalCount=briefing&&briefing.signaux?briefing.signaux.length:0
var riskCount=briefing&&briefing.risk_radar?briefing.risk_radar.length:0
var sourcesCount=briefing&&briefing.sources_count?briefing.sources_count:0

return h('section',{ref:heroRef,className:'v2-chrome relative pt-28 pb-14 md:pt-36 md:pb-20',style:{backgroundColor:'var(--chrome-ground)'}},
 h('div',{className:'hero-content relative max-w-5xl mx-auto px-4 sm:px-6',style:{willChange:'transform,opacity'}},

  // Ligne méta : statut « en direct » (identité) + kicker
  h('div',{className:'anim-fade-up flex items-center gap-3 mb-6'},
   h('span',{className:'inline-flex items-center gap-1.5 px-2.5 py-1 bg-[var(--editorial-accent)] text-[#F5EDE6] text-[10px] font-semibold uppercase tracking-[0.14em]',style:{fontFamily:"'IBM Plex Mono',monospace"}},
    h('span',{className:'w-1.5 h-1.5 rounded-full bg-[#F5EDE6]',style:{animation:'pulse-live 2s ease infinite'}}),
    'En direct'
   ),
   h('span',{className:'text-[11px] uppercase tracking-[0.18em] text-[var(--editorial-accent-text)]',style:{fontFamily:"'IBM Plex Mono',monospace"}},'Briefing stratégique')
  ),

  // Titre
  // lineHeight en style : la classe text-2xl de Tailwind fixe line-height à 2rem et l'emporte sur leading-[…] aux grandes tailles
  h('h1',{className:'anim-fade-up anim-d1 text-2xl sm:text-3xl md:text-[2.75rem] lg:text-[3.25rem] font-extrabold text-white tracking-tight max-w-3xl',style:{lineHeight:1.08}},
   briefing&&briefing.synthese&&briefing.synthese.titre?briefing.synthese.titre:'Briefing du jour'
  ),

  // Sous-titre
  h('p',{className:'anim-fade-up anim-d2 mt-5 text-base md:text-lg text-[#9AA0A4] leading-relaxed max-w-2xl'},
   briefing&&briefing.synthese&&briefing.synthese.sous_titre?briefing.synthese.sous_titre:'Synthèse IA quotidienne — signaux géopolitiques, financiers et risk radar'
  ),

  // Barre méta
  h('div',{className:'anim-fade-up anim-d3 mt-10 pt-5 flex flex-wrap items-center gap-4 border-t border-[rgba(232,228,216,.14)]'},
   dateStr?h('span',{className:'text-sm text-[#E8E4D8] first-letter:uppercase'},dateStr):null,
   // Sentiment = DONNÉE : couleur conservée
   h('span',{className:'px-2.5 py-1 text-[10px] font-bold uppercase tracking-[0.14em]',style:{fontFamily:"'IBM Plex Mono',monospace",color:sentimentColor,background:sentimentBg,border:'1px solid '+sentimentColor+'55'}},sentimentLabel),
   h('div',{className:'hidden sm:flex items-center gap-4 ml-auto'},
    sourcesCount>0?h('span',{className:'font-data text-[11px] text-[#9AA0A4]'},sourcesCount+' sources'):null,
    signalCount>0?h('span',{className:'font-data text-[11px] text-[#9AA0A4]'},signalCount+' signaux'):null,
    riskCount>0?h('span',{className:'font-data text-[11px] text-[#9AA0A4]'},riskCount+' risques'):null
   )
  )
 )
)
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function md(s){
if(!s)return''
return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code class="font-data text-[0.85em] px-1 py-0.5 bg-[#EAE1D4] text-[#101214]">$1</code>')
}
function mdBlock(s){
if(!s)return''
var lines=s.split('\n')
var html=''
var inList=false
for(var i=0;i<lines.length;i++){
var line=lines[i]
if(/^#{2,3}\s/.test(line)){
if(inList){html+='</ul>';inList=false}
var level=line.match(/^(#{2,3})/)[1].length
var text=line.replace(/^#{2,3}\s+/,'')
if(level===2)html+='<h2 style="font-family:Archivo,Arial,sans-serif;font-size:1.3rem;font-weight:800;letter-spacing:-0.02em;color:#101214;margin:2rem 0 0.75rem;padding-bottom:0.5rem;border-bottom:2px solid #8E2424">'+md(text)+'</h2>'
else html+='<h3 style="font-family:Archivo,Arial,sans-serif;font-size:1.05rem;font-weight:800;letter-spacing:-0.01em;color:#101214;margin:1.5rem 0 0.5rem">'+md(text)+'</h3>'
}else if(/^[-*]\s/.test(line)){
if(!inList){html+='<ul style="list-style:none;padding:0;margin:0.75rem 0">';inList=true}
html+='<li style="position:relative;padding-left:1.5rem;margin-bottom:0.5rem;font-size:0.92rem;color:#4C5052;line-height:1.65"><span style="position:absolute;left:0;color:#8E2424;font-weight:700;font-size:0.75rem;top:0.2rem">\u25B8</span>'+md(line.replace(/^[-*]\s+/,''))+'</li>'
}else if(line.trim()){
if(inList){html+='</ul>';inList=false}
html+='<p style="font-size:0.98rem;color:#101214;line-height:1.75;margin:0.75rem 0">'+md(line)+'</p>'
}
}
if(inList)html+='</ul>'
return html
}

// ─── TABLE OF CONTENTS (desktop sidebar) ────────────────────────────────────

var TOC_SECTIONS=[
{id:'signal-du-jour',label:'Signal du jour',icon:'\u26A1'},
{id:'synthese',label:'Synth\u00e8se',icon:'\uD83D\uDCDD'},
{id:'enjeux',label:'Enjeux cl\u00e9s',icon:'\uD83C\uDFAF'},
{id:'risques',label:'Radar des risques',icon:'\u26A0\uFE0F'},
{id:'themes',label:'Th\u00e8mes',icon:'\uD83D\uDCC8'},
{id:'agenda',label:'Agenda',icon:'\uD83D\uDCC5'}
]

function TableOfContents(props){
var active=useActiveSection(TOC_SECTIONS.map(function(s){return s.id}))
var briefing=props.briefing
if(!briefing)return null

var signalCount=briefing.signaux?briefing.signaux.length:0
var riskCount=briefing.risk_radar?briefing.risk_radar.length:0
var urgentCount=0
if(briefing.signaux)briefing.signaux.forEach(function(s){if(s.severite==='urgent')urgentCount++})
if(briefing.risk_radar)briefing.risk_radar.forEach(function(r){if(r.severite==='urgent')urgentCount++})

return h('aside',{className:'hidden xl:block sticky top-24 w-56 flex-shrink-0'},
 // Stats card
 h('div',{className:'mb-6 p-4 bg-[var(--surface-raised)] border border-[var(--hairline-warm)]'},
  h('p',{className:'text-[10px] font-semibold uppercase tracking-wider text-[#4C5052] mb-3'},'Aper\u00e7u'),
  h('div',{className:'space-y-2.5'},
   h('div',{className:'flex items-center justify-between'},
    h('span',{className:'text-xs text-[#4C5052]'},'Signaux'),
    h('span',{className:'font-data text-xs font-semibold text-[#101214]'},String(signalCount))
   ),
   h('div',{className:'flex items-center justify-between'},
    h('span',{className:'text-xs text-[#4C5052]'},'Risques'),
    h('span',{className:'font-data text-xs font-semibold text-[#101214]'},String(riskCount))
   ),
   urgentCount>0?h('div',{className:'flex items-center justify-between'},
    h('span',{className:'text-xs text-[#dc2626]'},'Urgents'),
    h('span',{className:'font-data text-xs font-bold text-[#dc2626]'},String(urgentCount))
   ):null,
   briefing.sources_count?h('div',{className:'flex items-center justify-between'},
    h('span',{className:'text-xs text-[#4C5052]'},'Sources'),
    h('span',{className:'font-data text-xs font-semibold text-[#101214]'},String(briefing.sources_count))
   ):null
  )
 ),

 // TOC links
 h('nav',{'aria-label':'Sommaire'},
  h('p',{className:'text-[10px] font-semibold uppercase tracking-wider text-[#4C5052] mb-3 px-1'},'Sommaire'),
  h('div',{className:'space-y-1'},
   TOC_SECTIONS.map(function(sec){
    var isActive=active===sec.id
    return h('a',{key:sec.id,href:'#'+sec.id,className:'flex items-center gap-2.5 px-2 py-1.5 text-xs transition-all duration-200 no-underline '+(isActive?'bg-[#EAE1D4] text-[#8E2424] font-semibold':'text-[#4C5052] hover:text-[#101214] hover:bg-[#E2DED3]')},
     h('span',{className:'toc-dot'+(isActive?' active':'')}),
     h('span',null,sec.label)
    )
   })
  )
 )
)
}

// ─── BRIEFING CONTENT ────────────────────────────────────────────────────────

function BriefingContent(props){
var briefing=props.briefing
if(!briefing)return h('div',{className:'max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-20 text-center'},
 h('div',{className:'inline-flex items-center gap-3 px-5 py-3 bg-[var(--surface-raised)] border border-[var(--hairline-warm)]'},
  h('div',{className:'w-5 h-5 border-2 border-[#8E2424] border-t-transparent rounded-full',style:{animation:'spin 1s linear infinite'}}),
  h('span',{className:'text-sm text-[#4C5052]'},'Chargement du briefing\u2026')
 )
)

var s=briefing.synthese||{}

return h('div',{className:'max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 md:py-16'},
 h('div',{className:'flex gap-12'},

  // Main content column
  h('div',{className:'flex-1 min-w-0'},

   // Pipeline intro bar
   h(Reveal,null,
    h('div',{className:'flex items-center gap-4 mb-10 pb-5 border-b border-[var(--hairline-warm)]'},
     h('div',{className:'flex items-center gap-2'},
      h('div',{className:'w-[3px] h-10 bg-[var(--editorial-accent)]'}),
      h('div',null,
       h('p',{className:'text-xs font-semibold text-[#101214] mb-0.5'},'Pipeline IA — Intelligence automatis\u00e9e'),
       h('p',{className:'text-[13px] text-[#4C5052] leading-relaxed m-0'},
        h('span',{className:'font-data text-[#101214] font-semibold'},'15'),
        ' APIs \u00b7 ',
        h('span',{className:'font-data text-[#101214] font-semibold'},'163'),
        ' flux RSS \u00b7 scoring IA \u00b7 d\u00e9duplication s\u00e9mantique'
       )
      )
     ),
     briefing.generated_at?h('span',{className:'hidden sm:block ml-auto font-data text-[10px] text-[#4C5052]/70'},
      'G\u00e9n\u00e9r\u00e9 le '+new Date(briefing.generated_at).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})
     ):null
    )
   ),

   // Signal du jour
   briefing.signal_du_jour?h(Reveal,null,
    h('div',{id:'signal-du-jour',className:'v2-chrome mb-10 relative overflow-hidden border-l-[3px] border-[var(--editorial-accent)]',style:{background:'var(--chrome-ground)'}},
     h('div',{className:'relative p-6 sm:p-8'},
      h('div',{className:'flex items-center gap-2 mb-3'},
       h('span',{className:'text-[11px] uppercase tracking-[0.18em] text-[var(--editorial-accent-text)]',style:{fontFamily:"'IBM Plex Mono',monospace"}},'Signal du jour')
      ),
      h('p',{className:'text-base sm:text-lg text-[#E8E4D8] leading-relaxed m-0',dangerouslySetInnerHTML:{__html:md(briefing.signal_du_jour)}})
     )
    )
   ):null,

   // Synthese
   s.contenu?h(Reveal,null,
    h('div',{id:'synthese',className:'mb-12'},
     h('div',{className:'prose-container',dangerouslySetInnerHTML:{__html:mdBlock(s.contenu)}})
    )
   ):null,

   // Signaux / Enjeux clés
   briefing.signaux&&briefing.signaux.length>0?h(Reveal,null,
    h('div',{id:'enjeux',className:'mb-14'},
     h('div',{className:'flex items-center gap-3 mb-6'},
      h('h3',{className:'text-xl font-extrabold text-[#101214]',style:{margin:0}},'Enjeux cl\u00e9s du jour'),
      h('div',{className:'flex-1 h-px bg-[var(--hairline-warm)]'}),
      h('span',{className:'font-data text-[11px] text-[#4C5052]'},briefing.signaux.length+' signaux')
     ),
     h('div',{className:'space-y-5'},
      briefing.signaux.map(function(sig,i){
       var sev=sig.severite||'info'
       var sevCls=sev==='urgent'?'urgent':sev==='attention'?'attention':'info'
       return h('div',{key:i,className:'briefing-card'},
        // Color stripe
        h('div',{className:'sev-stripe sev-'+sevCls}),
        // Header zone
        h('div',{className:'card-header'},
         h('div',{className:'flex-1 min-w-0'},
          h('div',{className:'flex items-center gap-2 mb-1.5'},
           h('span',{className:'sev-dot sev-dot-'+sevCls}),
           sig.regions&&sig.regions.length>0?h('span',{className:'text-[10px] text-[#4C5052] font-medium'},sig.regions.join(' \u00b7 ')):null
          ),
          h('h4',{className:'text-[16px] font-extrabold text-[#101214] leading-snug',dangerouslySetInnerHTML:{__html:md(sig.titre)}})
         ),
         h('span',{className:'sev-badge sev-badge-'+sevCls,style:{marginTop:2}},sev)
        ),
        // Body — description
        h('div',{className:'card-body'},
         h('p',{className:'text-[13.5px] text-[#2B2E31] leading-[1.75] m-0',dangerouslySetInnerHTML:{__html:md(sig.description)}})
        ),
        // Footer — interconnexions as structured table
        sig.interconnexions&&sig.interconnexions.length>0?h('div',{className:'card-footer'},
         h('p',{className:'text-[10px] font-bold uppercase tracking-wider text-[#4C5052] mb-3',style:{letterSpacing:'1px'}},'Interconnexions sectorielles'),
         h('div',{className:'inter-table'},
          sig.interconnexions.map(function(inter,j){
           return h('div',{key:j,className:'inter-row'},
            h('div',{className:'inter-cell-label'},
             h('span',{className:'text-[#8E2424]',style:{fontSize:10,marginTop:1}},'\u25B8'),
             h('span',null,inter.secteur)
            ),
            h('div',{className:'inter-cell-value'},
             h('strong',{className:'font-data',style:{fontSize:11}},inter.impact),
             inter.explication?h('span',null,' \u2014 '+inter.explication):null
            )
           )
          })
         )
        ):null
       )
      })
     )
    )
   ):null,

   // Risk Radar
   briefing.risk_radar&&briefing.risk_radar.length>0?h(Reveal,null,
    h('div',{id:'risques',className:'mb-14'},
     h('div',{className:'flex items-center gap-3 mb-6'},
      h('h3',{className:'text-xl font-extrabold text-[#101214]',style:{margin:0}},'Radar des risques'),
      h('div',{className:'flex-1 h-px bg-[var(--hairline-warm)]'}),
      h('span',{className:'font-data text-[11px] text-[#4C5052]'},briefing.risk_radar.length+' risques')
     ),
     h('div',{className:'space-y-5'},
      briefing.risk_radar.map(function(risk,i){
       var sev=risk.severite||'info'
       var sevCls=sev==='urgent'?'urgent':sev==='attention'?'attention':'info'
       var sevColor=sev==='urgent'?'#dc2626':sev==='attention'?'#d97706':'#3b82f6'
       var probaWidth=risk.probabilite==='elevee'?'85%':risk.probabilite==='moyenne'?'50%':'20%'
       var probaLabel=risk.probabilite==='elevee'?'\u00c9lev\u00e9e':risk.probabilite==='moyenne'?'Moyenne':'Faible'
       return h('div',{key:i,className:'briefing-card'},
        h('div',{className:'sev-stripe sev-'+sevCls}),
        // Header
        h('div',{className:'card-header'},
         h('div',{className:'flex-1 min-w-0'},
          h('strong',{className:'text-[16px] font-extrabold text-[#101214] leading-snug block',style:{fontFamily:"'Archivo',Arial,sans-serif",letterSpacing:'-0.01em'},dangerouslySetInnerHTML:{__html:md(risk.risque)}})
         ),
         h('span',{className:'sev-badge sev-badge-'+sevCls,style:{marginTop:2}},sev)
        ),
        // Body — description
        h('div',{className:'card-body'},
         h('p',{className:'text-[13.5px] text-[#2B2E31] leading-[1.75] m-0 mb-5',dangerouslySetInnerHTML:{__html:md(risk.description)}}),
         // Probability meter + Impact — structured footer area
         h('div',{className:'grid sm:grid-cols-3 gap-4 p-4 bg-[var(--surface-page)] border border-[var(--hairline-warm)]'},
          // Probability meter — 2 cols
          h('div',{className:'sm:col-span-2'},
           h('div',{className:'flex items-center justify-between mb-2'},
            h('span',{className:'text-[10px] font-semibold uppercase tracking-wider text-[#4C5052]',style:{letterSpacing:'1px'}},'Probabilit\u00e9'),
            h('span',{className:'font-data text-[11px] font-bold',style:{color:sevColor}},probaLabel)
           ),
           h('div',{className:'prob-meter'},
            h('div',{className:'prob-fill',style:{width:probaWidth,background:'linear-gradient(90deg, '+sevColor+'88, '+sevColor+')'}})
           ),
           h('div',{className:'prob-markers'},
            h('span',{className:'prob-marker'},'Faible'),
            h('span',{className:'prob-marker'},'Moyenne'),
            h('span',{className:'prob-marker'},'\u00c9lev\u00e9e')
           )
          ),
          // Impact
          risk.impact_marche?h('div',{className:'sm:border-l sm:border-[var(--hairline-warm)] sm:pl-4'},
           h('span',{className:'text-[10px] font-semibold uppercase tracking-wider text-[#4C5052] block mb-1.5',style:{letterSpacing:'1px'}},'Impact march\u00e9'),
           h('p',{className:'text-[12.5px] text-[#101214] leading-snug m-0 font-medium'},risk.impact_marche)
          ):null
         )
        )
       )
      })
     )
    )
   ):null,

   // Themes a surveiller
   (function(){
    var themes=briefing.themes_a_surveiller||briefing.positionnement
    if(!themes||themes.length===0)return null
    var disclaimer=briefing.themes_disclaimer||briefing.positionnement_disclaimer||'Ces \u00e9l\u00e9ments sont des observations factuelles et ne constituent pas un conseil en investissement. Consultez un professionnel agr\u00e9\u00e9 (CIF-AMF) avant toute d\u00e9cision.'
    return h(Reveal,null,
     h('div',{id:'themes',className:'mb-14'},
      h('div',{className:'flex items-center gap-3 mb-6'},
       h('h3',{className:'text-xl font-extrabold text-[#101214]',style:{margin:0}},'Th\u00e8mes \u00e0 surveiller'),
       h('div',{className:'flex-1 h-px bg-[var(--hairline-warm)]'})
      ),
      h('div',{className:'grid gap-4 sm:grid-cols-2'},
       themes.map(function(pos,i){
        var dyn=pos.dynamique||pos.direction||'neutre'
        var isUp=dyn==='haussiere'||dyn==='surponderer'
        var isDown=dyn==='baissiere'||dyn==='sous-ponderer'
        var isVolatile=dyn==='volatile'||dyn==='hedge'
        var color=isUp?'#16a34a':isDown?'#dc2626':isVolatile?'#d97706':'#94a3b8'
        var bgTint=isUp?'#f0fdf4':isDown?'#fef2f2':isVolatile?'#fffbeb':'#f8fafc'
        var label=isUp?'Haussi\u00e8re':isDown?'Baissi\u00e8re':isVolatile?'Volatile':'Neutre'
        // SVG arrows
        var arrowPath=isUp?'M7 17V3m0 0l-5 5m5-5l5 5':isDown?'M7 3v14m0 0l-5-5m5 5l5-5':isVolatile?'M7 3v14M2 7l5-4 5 4M2 13l5 4 5-4':'M3 7h14'
        return h('div',{key:i,className:'briefing-card'},
         h('div',{className:'flex items-start gap-3 p-4 sm:p-5'},
          // Arrow icon
          h('div',{className:'theme-arrow',style:{background:bgTint,border:'1px solid '+color+'25'}},
           h('svg',{viewBox:'0 0 14 20',fill:'none',stroke:color,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},
            h('path',{d:arrowPath})
           )
          ),
          // Content
          h('div',{className:'flex-1 min-w-0'},
           h('div',{className:'flex items-center justify-between gap-2 mb-1.5'},
            h('strong',{className:'text-[13.5px] text-[#101214]'},pos.actif||''),
            h('span',{className:'text-[10px] font-bold uppercase tracking-wider',style:{color:color}},label)
           ),
           h('p',{className:'text-[12.5px] text-[#4C5052] leading-[1.65] m-0'},pos.details||'')
          )
         )
        )
       })
      ),
      h('p',{className:'text-[11px] text-[#4C5052]/70 italic mt-5 leading-relaxed pl-1'},disclaimer)
     )
    )
   })(),

   // Agenda
   briefing.agenda&&briefing.agenda.length>0?h(Reveal,null,
    h('div',{id:'agenda',className:'mb-12'},
     h('div',{className:'flex items-center gap-3 mb-6'},
      h('h3',{className:'text-xl font-extrabold text-[#101214]',style:{margin:0}},'Agenda de la semaine'),
      h('div',{className:'flex-1 h-px bg-[var(--hairline-warm)]'})
     ),
     h('div',{className:'briefing-card'},
      briefing.agenda.map(function(evt,i){
       var isLast=i===briefing.agenda.length-1
       return h('div',{key:i,className:'flex items-start gap-4 px-5 py-3.5 sm:px-6 sm:py-4'+(isLast?'':' border-b border-[var(--hairline-warm)]')},
        // Date column
        h('div',{className:'flex-shrink-0 w-24 sm:w-28'},
         h('span',{className:'font-data text-[11px] font-bold text-[#8E2424] block'},evt.date||''),
         evt.heure?h('span',{className:'font-data text-[10px] text-[#4C5052]/70'},evt.heure):null
        ),
        // Event
        h('div',{className:'flex-1 min-w-0'},
         h('span',{className:'text-[13px] text-[#101214] font-medium leading-snug'},evt.evenement||'')
        ),
        // Impact
        evt.impact_attendu?h('div',{className:'hidden sm:block flex-shrink-0 max-w-[10rem] text-right'},
         h('span',{className:'text-[11px] text-[#4C5052] italic leading-snug'},evt.impact_attendu)
        ):null
       )
      })
     )
    )
   ):null,

   // Tags
   briefing.tags&&briefing.tags.length>0?h(Reveal,null,
    h('div',{className:'pt-6 border-t border-[var(--hairline-warm)]'},
     h('div',{className:'flex flex-wrap gap-2'},
      briefing.tags.map(function(t,i){
       return h('span',{key:i,className:'px-3 py-1.5 text-[11px] font-medium bg-[var(--badge-bg)] text-[var(--badge-text)] cursor-default',style:{fontFamily:"'IBM Plex Mono',monospace"}},t)
      })
     )
    )
   ):null

  ), // end main column

  // Sidebar (TOC)
  h(TableOfContents,{briefing:briefing})

 ) // end flex
)
}

// ─── APP ─────────────────────────────────────────────────────────────────────

function App(){
var ref=useState(null)
var briefing=ref[0]
var setBriefing=ref[1]

useEffect(function(){
fetch('data/daily-briefing.json').then(function(r){return r.ok?r.json():null}).then(function(d){
if(d&&d.synthese&&d.synthese.titre)setBriefing(d)
}).catch(function(){})
},[])

return h('div',null,
 h(Navigation),
 h('main',{id:'main-content'},
  h(BriefingHero,{briefing:briefing}),
  h(BriefingContent,{briefing:briefing})
 ),
 h(Footer)
)
}

createRoot(document.getElementById('app')).render(h(App))
</script>
