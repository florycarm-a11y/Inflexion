name: Collecte des communiqués SEC (backtest)

# Outil ponctuel du backtest de la méthode Inflexion : télécharge les communiqués de
# résultats et les dépôts listés dans scripts/backtest/*.json et les publie en artefact.
# Ne modifie aucun fichier du dépôt.
on:
  workflow_dispatch:
  push:
    branches: [chore/collecte-communiques-sec]
    paths:
      - .github/workflows/collecte-communiques-sec.yml
      - scripts/backtest/**

permissions:
  contents: read

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Télécharger les communiqués
        run: node scripts/backtest/fetch-sec-communiques.mjs scripts/backtest/documents-dix-cas.json
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - uses: actions/upload-artifact@v4
        with:
          name: documents-dix-cas
          path: out/communiques
          retention-days: 7
