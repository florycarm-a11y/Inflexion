# TEMPORAIRE — comparaison Nasdaq / Finnhub des données d'analystes, depuis GitHub Actions.
# Ne vise que la branche feat/lecture-marche, en lecture seule : n'écrit rien, ne déploie rien.
# À supprimer dès le résultat lu.

name: "🧪 Lecture de marché — essai à blanc"

on:
  push:
    branches: [feat/lecture-marche]

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Nasdaq : collecte à blanc"
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          node scripts/marche/collecte.mjs --dry-run > collecte.log
          node -e '
            const t = require("fs").readFileSync("collecte.log", "utf8");
            const inst = JSON.parse(t.slice(t.indexOf("{\n")));
            for (const [id, s] of Object.entries(inst.societes))
              console.log("NASDAQ " + s.ticker + " " + JSON.stringify(s.attentes));
          '

      - name: "Finnhub : recommandations et surprises"
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          node -e '
            const lire = async (chemin) => {
              const r = await fetch("https://finnhub.io/api/v1" + chemin, { headers: { "X-Finnhub-Token": process.env.FINNHUB_API_KEY } });
              return r.ok ? r.json() : { erreur: "HTTP " + r.status, corps: (await r.text()).slice(0, 200) };
            };
            (async () => {
              for (const t of ["LEU", "RKLB", "IONQ", "VRT", "S", "OKLO", "AGLT"]) {
                const reco = await lire("/stock/recommendation?symbol=" + t);
                console.log("FINNHUB reco " + t + " " + JSON.stringify(Array.isArray(reco) ? reco.slice(0, 4) : reco));
                const surp = await lire("/stock/earnings?symbol=" + t + "&limit=4");
                console.log("FINNHUB surprises " + t + " " + JSON.stringify(surp));
                await new Promise((r) => setTimeout(r, 1200));
              }
              for (const chemin of ["/stock/price-target?symbol=VRT", "/stock/revenue-estimate?symbol=VRT&freq=quarterly", "/stock/eps-estimate?symbol=VRT&freq=quarterly"])
                console.log("FINNHUB " + chemin + " " + JSON.stringify(await lire(chemin)).slice(0, 600));
            })();
          '
