<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1200"/>
<title>OG Image — Inflexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#17100E}
body{font-family:'IBM Plex Sans','Helvetica Neue',sans-serif}

.og{
  width:1200px;
  height:630px;
  background:#17100E;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:72px 88px 96px;
}

.glow{
  position:absolute;
  top:-180px;right:-120px;
  width:640px;height:640px;
  background:radial-gradient(circle,rgba(142,36,36,.22) 0%,transparent 68%);
  pointer-events:none;
}
.glow-2{
  position:absolute;
  bottom:-220px;left:-100px;
  width:520px;height:520px;
  background:radial-gradient(circle,rgba(66,48,30,.45) 0%,transparent 70%);
  pointer-events:none;
}

.grid-pattern{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(245,237,230,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(245,237,230,.035) 1px,transparent 1px);
  background-size:60px 60px;
  pointer-events:none;
}

.top-bar{
  position:absolute;
  top:0;left:0;right:0;
  height:4px;
  background:#8E2424;
}

.logo{
  position:relative;
  margin-bottom:36px;
}
.logo img{
  height:64px;
  width:auto;
  display:block;
}

.eyebrow{
  position:relative;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  font-weight:600;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:#E05A4E;
  margin-bottom:22px;
}

.title{
  position:relative;
  font-family:'Archivo',Arial,sans-serif;
  font-size:64px;
  font-weight:800;
  color:#F5EDE6;
  line-height:1.02;
  letter-spacing:-0.035em;
  max-width:920px;
}

.subtitle{
  position:relative;
  margin-top:22px;
  font-size:22px;
  line-height:1.4;
  color:rgba(245,237,230,.70);
  max-width:720px;
}

.stats{
  position:absolute;
  bottom:44px;left:88px;right:88px;
  display:flex;
  gap:48px;
  padding-top:22px;
  border-top:1px solid rgba(245,237,230,.14);
}
.stat-value{
  font-family:'IBM Plex Mono',monospace;
  font-size:26px;
  font-weight:600;
  color:#F5EDE6;
  letter-spacing:-0.02em;
}
.stat-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.14em;
  color:rgba(245,237,230,.55);
  margin-top:6px;
}

.url{
  position:absolute;
  bottom:48px;right:88px;
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;
  font-weight:600;
  letter-spacing:0.04em;
  color:rgba(245,237,230,.55);
}
</style>
</head>
<body>
<div class="og">
  <div class="glow"></div>
  <div class="glow-2"></div>
  <div class="grid-pattern"></div>
  <div class="top-bar"></div>

  <div class="logo">
    <img src="logo-header.png" alt="Inflexion"/>
  </div>

  <p class="eyebrow">178 sources · 15 APIs · analyse IA</p>

  <h1 class="title">Révéler les signaux<br>que le bruit dissimule.</h1>

  <p class="subtitle">Intelligence géopolitique et financière pour les décideurs.</p>

  <div class="stats">
    <div>
      <div class="stat-value">178</div>
      <div class="stat-label">Sources</div>
    </div>
    <div>
      <div class="stat-value">15</div>
      <div class="stat-label">APIs</div>
    </div>
    <div>
      <div class="stat-value">24/7</div>
      <div class="stat-label">Veille IA</div>
    </div>
  </div>

  <div class="url">inflexionhub.com</div>
</div>
</body>
</html>
