<style>
/* Identité v2 « chaude » — rouge & brun prédominants (home).
   La palette chaude vit dans les jetons partagés : assets/design-tokens-v2.css
   (--editorial-accent, --editorial-accent-text, --chrome-ground, --credibility-band,
   --hairline-warm, --badge-bg/--badge-text). Cette page les consomme, ne les duplique pas. */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans','Helvetica Neue',sans-serif;background:var(--surface-page);color:var(--text-primary);overflow-x:hidden}

h1,h2,h3,.display-text{font-family:'Archivo',Arial,sans-serif;font-weight:800;line-height:1.1;letter-spacing:-0.035em;color:var(--text-primary)}

/* Kicker éditorial « § … » — rouge sur surfaces claires (override inline sur sombre) */
.kicker{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.18em;color:var(--editorial-accent)}
.font-data{font-family:'IBM Plex Mono','SF Mono',monospace}

/* Nav links */
.nav-link{position:relative}
.nav-link::after{content:'';position:absolute;bottom:-2px;left:0;width:100%;height:2px;background:var(--editorial-accent-text);transform:scaleX(0);transition:transform var(--motion-fast)}
.nav-link.active::after{transform:scaleX(1)}

/* Méga-menu — verre sombre sur le hero espresso (audit Starlink 5.7), filet rouge en tête. Il ne s'ouvre qu'au repos : au défilement les rubriques s'effacent (.nav-state). */
.mega-trigger{position:relative}
.mega-menu{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(8px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity var(--motion-base),transform var(--motion-base),visibility var(--motion-base);min-width:340px;z-index:60;background:rgba(23,16,14,.78);backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--chrome-border);box-shadow:0 12px 32px rgba(0,0,0,.35)}
/* À l'ouverture, visibility bascule tout de suite (comme .mobile-overlay.open) : en transition elle vaut encore hidden à p = 0,
   et le panneau comme son pont ne recevaient pas le pointeur pendant la première image. La fermeture garde le fondu (règle de base). */
.mega-menu.mega-open{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0);transition:opacity var(--motion-base),transform var(--motion-base)}
.mega-menu::before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:2px;background:var(--editorial-accent);z-index:2}
/* Pont sous la rubrique pendant le glissement d'ouverture : le panneau monte de 8 px en --motion-base ; tant qu'il n'a pas rejoint le bouton,
   la bande entre les deux n'appartient à rien et y passer le refermait. Ce pseudo-élément invisible couvre exactement cette bande : sa hauteur
   (bordure comprise, 9 px puis 1 px) suit la même transition que le glissement ; il a la largeur du panneau et ne déborde pas sur les boutons
   (à une fraction de pixel près en mise à l'échelle fractionnaire, où la bordure de 1 px est arrondie au pixel physique). */
.mega-menu::after{content:'';position:absolute;left:0;right:0;bottom:100%;height:9px;transition:height var(--motion-base)}
.mega-menu.mega-open::after{height:1px}
.mega-item{transition:background var(--motion-fast)}
/* En-tête : seules la couleur de fond et celle du filet bas sont animées (audit 7.9) ; la bordure transparente au repos donne à border-color un point de départ. backdrop-filter n'est pas animé. */
.site-header{border-bottom:1px solid transparent;transition:background-color var(--motion-base),border-color var(--motion-base)}
/* Déclaré après .site-header : à spécificité égale, son raccourci border-bottom écraserait border-bottom-color. */
.nav-scrolled{background:var(--chrome-scrolled);backdrop-filter:blur(16px);border-bottom-color:var(--chrome-border)}
/* Deux états (audit 6.4) : rubriques au repos, bouton « Menu » après 60 px. Les deux occupent la même cellule de grille, alignés à droite :
   la cellule garde la largeur des rubriques et le CTA ne bouge pas. Opacité animée ; visibility sort l'état masqué du focus, pointer-events du clic.
   Portée par ces div, jamais par les boutons : leur transition-colors (site.css, chargé en dernier) écraserait la transition d'opacité. */
.nav-states{display:grid;justify-items:end;align-items:center}
.nav-state{grid-area:1/1;transition:opacity var(--motion-base),visibility var(--motion-base)}
.nav-state.is-hidden{opacity:0;visibility:hidden;pointer-events:none}

/* Focus */
:focus-visible{outline:2px solid var(--text-primary);outline-offset:2px}
header :focus-visible,.mobile-overlay :focus-visible,.v2-chrome :focus-visible{outline-color:var(--editorial-accent-text)}

/* Hamburger */
.hamburger span{display:block;width:24px;height:2px;background:var(--chrome-text);margin:5px 0;transition:all var(--motion-base)}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}

/* Mobile overlay */
.mobile-overlay{opacity:0;visibility:hidden;transition:opacity var(--motion-base),visibility var(--motion-base);height:100vh;height:100dvh}
/* À l'ouverture, seule l'opacité est animée : visibility doit être visible à l'instant où l'effet React donne le focus à la croix
   (en transition, visibility vaut encore hidden à p = 0 et le focus est refusé). À la fermeture, la transition de base retarde le masquage. */
.mobile-overlay.open{opacity:1;visibility:visible;transition:opacity var(--motion-base)}
@keyframes menu-item-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.menu-item{opacity:0}
.mobile-overlay.open .menu-item{animation:menu-item-in var(--motion-slow) forwards}
body.menu-open{overflow:hidden}

/* Hero glow — lueur rouge chaude */
.hero-glow{position:absolute;top:-120px;right:-80px;width:560px;height:560px;background:radial-gradient(circle,rgba(224,90,78,.12) 0%,transparent 70%);pointer-events:none}

/* Cartes de renvoi — filet de lecture rouge */
.article-card{position:relative;transition:box-shadow var(--motion-fast),border-color var(--motion-fast)}
.article-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--editorial-accent);transform:scaleY(0);transform-origin:top;transition:transform var(--motion-fast);z-index:1}

/* Apparitions — composant Reveal : un élément à la fois, opacité et 16 px, var(--motion-slow) (audit Starlink 7.2-7.4).
   Déclaré après .article-card pour que sa transition gagne pendant l'apparition ; Reveal retire la classe ensuite. */
.reveal{opacity:0;transform:translateY(16px);transition:opacity var(--motion-slow),transform var(--motion-slow)}
.reveal.is-visible{opacity:1;transform:none}

/* Zoom des images au survol : durée en jeton, coupé sur tactile et en mouvement réduit. La home du tracker ne porte plus d'image,
   la règle reste pour la cohérence du bloc mouvement réduit (home-motion) et pour tout retour d'une image. */
.zoom-hover{transition:transform var(--motion-slow)}

/* Survols — seulement pour un pointeur capable de survoler (audit 7.6) : sur tactile un :hover resterait collé après le toucher */
@media(hover:hover){
.nav-link:hover::after{transform:scaleX(1)}
.mega-item:hover{background:rgba(245,237,230,.07)}
.article-card:hover{box-shadow:0 6px 18px rgba(42,18,16,.12);border-color:var(--editorial-accent)}
.article-card:hover::before{transform:scaleY(1)}
}

/* Mouvement réduit : contenu affiché sans apparition, pas de zoom, entrées du menu visibles (audit 7.5). */
@media(prefers-reduced-motion:reduce){
.article-card::before{transition:none}
.reveal{opacity:1;transform:none;transition:none}
.zoom-hover{transition:none}
.mobile-overlay.open .menu-item{animation:none;opacity:1}
}

/* Impression : rien ne doit rester invisible faute d'avoir défilé */
@media print{.reveal{opacity:1;transform:none}}

@media(max-width:768px){
html,body{overflow-x:hidden}
img{max-width:100%;height:auto}
a,button{min-height:44px;min-width:44px}
.mobile-overlay .menu-item a{min-height:48px;display:flex;align-items:center}
}
</style>

<script type="module">
import React,{useState,useEffect,useRef} from 'https://esm.sh/react@18.2.0'
import{createRoot}from 'https://esm.sh/react-dom@18.2.0/client'

const h=React.createElement

// Apparitions (audit Starlink 7.2-7.5). Un seul IntersectionObserver pour tous les Reveal :
// les éléments qui franchissent le seuil dans la même image forment un lot, et le rang dans le lot
// porte le décalage des grilles (stagger). Un décalage par index cumulerait un retard visible
// sur les cartes hors du premier écran (9e carte de veille : 0,78 s après son entrée dans l'écran).
const revealAttente=new Map() // élément → {stagger, declencher}
let revealIO=null
function observerReveal(el,entree){
if(!revealIO)revealIO=new IntersectionObserver(entries=>{
let rang=0
for(const e of entries){
if(!e.isIntersecting)continue
const a=revealAttente.get(e.target)
if(!a)continue
revealAttente.delete(e.target);revealIO.unobserve(e.target)
a.declencher(a.stagger?rang++:0)
}
},{threshold:0.15})
revealAttente.set(el,entree);revealIO.observe(el)
return()=>{revealAttente.delete(el);revealIO.unobserve(el)}
}
const reduireMouvement=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches

// Anime UN élément (opacity 0→1, translateY 16px→0, var(--motion-slow)) à son entrée dans l'écran.
// delay : secondes avant le départ ; stagger : secondes ajoutées par rang dans le lot (cartes d'une grille).
// L'enfant est cloné, pas enveloppé : un div intermédiaire casserait l'égalisation des hauteurs dans les grilles.
// Une fois la transition finie, l'enfant est rendu tel quel (plus de classe ni de délai) pour ne pas
// interférer avec ses propres transitions (.article-card) et rester identique au pixel à l'original.
// Enfant hôte (balise) uniquement : la ref doit viser un nœud DOM. Sa ref et son transitionDelay sont remplacés, son onTransitionEnd chaîné.
// Limite : une transition interrompue (display:none en cours, transitioncancel) n'émet pas transitionend ; l'élément garde alors la classe :
// visuel identique, seule la transition de survol d'une carte est perdue jusqu'au rechargement (React 18 n'expose pas onTransitionCancel).
function Reveal({delay=0,stagger=0,children}){
const enfant=React.Children.only(children)
if(typeof enfant.type!=='string')throw new Error('Reveal : enfant hôte (balise) requis, la ref doit viser un nœud DOM')
const ref=useRef(null)
const[rang,setRang]=useState(-1) // -1 : pas encore entré dans l'écran
const[fini,setFini]=useState(false)
const[reduit]=useState(reduireMouvement) // lu au montage : un élément rendu nu le reste (il n'a pas d'observateur), même si la préférence change ensuite
useEffect(()=>{if(ref.current)return observerReveal(ref.current,{stagger,declencher:setRang})},[])
if(fini||reduit)return enfant
const retard=Math.round((delay+Math.max(rang,0)*stagger)*1000)/1000 // évite 0.3+2*0.06 = 0.42000000000000004 dans le DOM
return React.cloneElement(enfant,{
ref,
className:`${enfant.props.className||''} reveal${rang>=0?' is-visible':''}`.trim(),
style:{...enfant.props.style,transitionDelay:`${retard}s`},
onTransitionEnd:e=>{enfant.props.onTransitionEnd?.(e);if(e.target===e.currentTarget&&e.propertyName==='opacity')setFini(true)}
})
}

const MEGA_NAV=window.MEGA_NAV

// ─── TRACKER — modèle (tracker-modele.js, chargé avant ce module) ────────────
// Source de vérité du calcul : docs/tracker-methode.md (v1.3 figée le 21 novembre 2026).
// La home ne réécrit aucune règle : elle consomme le vocabulaire et la validation du modèle.

const TK=window

// Chiffres de la section 12 de la méthode (docs/tracker-methode.md) — le backtest, échecs compris.
const BACKTEST_STATS=[
{value:'17',label:'Cas rejoués — 7 pour construire, 10 pour tester, règles figées'},
{value:'146',label:'Publications de résultats lues, une ligne par publication'},
{value:'5/5',label:'Succès boursiers signalés par une Bascule'},
{value:'3/5',label:'Échecs boursiers aussi signalés — la Bascule ne trie pas'},
]

// ─── NAVIGATION (chrome v2 chaud) ────────────────────────────────────────────

function Navigation(){
const[open,setOpen]=useState(false)
const[scrolled,setScrolled]=useState(()=>window.scrollY>60) // lu au montage : rechargement ou retour arrière avec défilement restauré
const[megaOpen,setMegaOpen]=useState(-1)
const ouvreur=useRef(null) // bouton qui a ouvert l'overlay : le focus lui revient à la fermeture
const survol=useRef(-1) // rubrique ouverte au survol (l'entrée du pointeur qui l'ouvre la marque, le clic et l'Entrée effacent la marque). La sortie du pointeur ne ferme
                        // QUE ce panneau-là, sauf si le focus clavier (:focus-visible) est dans le panneau ; ouvert au clic ou au clavier, il reste ouvert à la sortie
                        // (épinglé), quel que soit le moteur : Safari et Firefox macOS ne donnent pas le focus à un bouton cliqué, et un lien focalisé à la souris
                        // (Ctrl+clic, glisser) n'est pas « focus-visible ». Clic ailleurs, Échap, défilement, perte de focus de la rubrique ou de la fenêtre ferment.
useEffect(()=>{
const fn=()=>setScrolled(window.scrollY>60)
window.addEventListener('scroll',fn,{passive:true})
return()=>window.removeEventListener('scroll',fn)
},[])
useEffect(()=>{
if(scrolled)setMegaOpen(-1) // un panneau ouvert garderait visibility:visible sous des rubriques effacées
},[scrolled])
// Panneau ouvert : un toucher ou un clic hors de tout déclencheur le ferme (iOS ne donne pas le focus aux boutons : onBlur n'y suffit pas)
useEffect(()=>{
if(megaOpen<0)return
const fermer=e=>{if(!e.target.closest?.('.mega-trigger'))setMegaOpen(-1)}
const echap=e=>{if(e.key==='Escape')setMegaOpen(-1)} // panneau ouvert au survol : rien n'a le focus, le onKeyDown du déclencheur ne reçoit rien
const quitter=()=>setMegaOpen(-1) // la fenêtre perd le focus (autre onglet, autre application, barre d'adresse) : rien ne reste ouvert au retour
document.addEventListener('pointerdown',fermer);document.addEventListener('keydown',echap);window.addEventListener('blur',quitter)
return()=>{document.removeEventListener('pointerdown',fermer);document.removeEventListener('keydown',echap);window.removeEventListener('blur',quitter)}
},[megaOpen])
useEffect(()=>{
if(!open)return
document.body.classList.add('menu-open')
const fn=e=>{if(e.key==='Escape')setOpen(false)}
document.addEventListener('keydown',fn)
document.getElementById('menu-overlay').querySelector('button').focus() // le focus entre dans le dialogue (la croix) : sinon Tab parcourt l'en-tête invisible derrière
return()=>{
document.body.classList.remove('menu-open');document.removeEventListener('keydown',fn)
const o=ouvreur.current;o?.focus()
if(document.activeElement!==o)document.querySelector('header a')?.focus() // ouvreur masqué (redimensionnement, en-tête revenu au repos) : repli sur le logo
}
},[open])
return h('div',null,
 h('div',{className:'fixed top-0 left-0 right-0 z-[51] h-[3px] bg-[var(--editorial-accent)]'}),
 h('header',{className:`site-header fixed top-[3px] left-0 right-0 z-50 ${scrolled?'nav-scrolled':'bg-transparent'}`},
  h('div',{className:'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8'},
   h('div',{className:'flex items-center justify-between h-16'},
    h('a',{href:'index.html',className:'flex items-center gap-2'},
     h('img',{src:'logo-header.png',alt:'Inflexion',className:'h-10 w-auto',style:{filter:'brightness(10) saturate(0)'}})
    ),
    h('nav',{className:'hidden md:flex items-center gap-1','aria-label':'Navigation principale'},
     h('div',{className:'nav-states'},
      h('div',{className:'nav-state flex items-center gap-1'+(scrolled?' is-hidden':'')},
     ...MEGA_NAV.map((cat,ci)=>{
      const isWide=cat.children.length>3
      // Modèle « disclosure » : le clic bascule (souris, toucher, Entrée, Espace), Échap ferme et rend le focus ; le survol n'ouvre que pour une vraie souris
      // (le survol émulé d'un toucher, suivi du clic, ouvrirait puis refermerait). Pas d'ouverture au focus : tabuler le long de la barre n'ouvre rien.
      // Une rubrique ne ferme que SON panneau, en forme fonctionnelle (état à jour) : en Chrome, l'entrée dans la rubrique voisine part avant la sortie
      // de la rubrique quittée, et la perte de focus d'une rubrique ne doit pas fermer le panneau d'une autre (le clic sur un de ses liens serait perdu).
      // Perte de focus « vers rien » (relatedTarget nul : clic sur une zone non focalisable, ou sur un lien sous Safari, qui ne donne pas le focus aux liens) :
      // on ne ferme pas, sinon le panneau disparaît sous le clic ; le clic hors des rubriques et la perte de focus de la fenêtre ferment par ailleurs.
      return h('div',{key:ci,className:'mega-trigger',onPointerEnter:(e)=>{if(e.pointerType==='mouse'){if(megaOpen!==ci)survol.current=ci;setMegaOpen(ci)}},onMouseLeave:(e)=>{const f=document.activeElement;if(survol.current===ci&&!(e.currentTarget.querySelector('.mega-menu').contains(f)&&f.matches(':focus-visible')))setMegaOpen(m=>m===ci?-1:m)},onBlur:(e)=>{if(e.relatedTarget&&!e.currentTarget.contains(e.relatedTarget))setMegaOpen(m=>m===ci?-1:m)},onKeyDown:(e)=>{if(e.key==='Escape'&&megaOpen===ci){setMegaOpen(-1);e.currentTarget.querySelector('button').focus()}}},
       h('button',{type:'button','aria-expanded':megaOpen===ci,'aria-controls':'mega-panel-'+ci,onClick:()=>{survol.current=-1;setMegaOpen(m=>m===ci?-1:ci)},className:'nav-link px-3 py-2 text-sm transition-colors select-none text-[var(--chrome-text-2)] hover:text-[var(--chrome-text-1)] focus-visible:text-[var(--chrome-text-1)] bg-transparent border-0 cursor-pointer'},cat.label),
       h('div',{id:'mega-panel-'+ci,className:'mega-menu '+(megaOpen===ci?'mega-open ':'')+'p-5',style:{minWidth:isWide?'440px':'340px'}},
        h('p',{className:'kicker mb-3 px-3',style:{color:'var(--editorial-accent-text)'}},cat.label),
        h('div',{className:isWide?'grid grid-cols-2 gap-1':'grid gap-1'},
         ...cat.children.map((item,ii)=>
          h('a',{key:ii,href:item.href,className:'mega-item flex flex-col px-3 py-2.5 no-underline'},
           h('span',{className:'text-sm font-semibold text-[var(--chrome-text-1)]'},item.label),
           h('span',{className:'text-xs text-[var(--chrome-text-2)] mt-0.5'},item.desc)
          )
         )
        )
       )
      )}
      )
      ),
      h('div',{className:'nav-state'+(scrolled?'':' is-hidden')},
       h('button',{type:'button',onClick:(e)=>{ouvreur.current=e.currentTarget;setOpen(true)},'aria-expanded':open,'aria-controls':'menu-overlay',className:'nav-link px-3 py-2 text-sm transition-colors select-none text-[var(--chrome-text-2)] hover:text-[var(--chrome-text-1)] focus-visible:text-[var(--chrome-text-1)] bg-transparent border-0 cursor-pointer'},'Menu')
      )
     ),
     h('a',{href:'premium.html',className:'ml-4 px-4 py-2 bg-[var(--editorial-accent)] hover:bg-[#6E1B1B] text-[var(--chrome-text-1)] font-semibold text-sm transition-colors'},'Réserver un diagnostic')
    ),
    h('button',{className:`hamburger md:hidden p-2 ${open?'open':''}`,onClick:(e)=>{ouvreur.current=e.currentTarget;setOpen(!open)},'aria-label':'Menu','aria-expanded':open,'aria-controls':'menu-overlay'},
     h('span'),h('span'),h('span')
    )
   )
  )
 ),
 h('div',{id:'menu-overlay',role:'dialog','aria-modal':'true','aria-label':'Menu',className:`mobile-overlay fixed inset-0 z-[60] flex flex-col ${open?'open':''}`,style:{backgroundColor:'var(--chrome-ground)'}},
  h('div',{className:'flex items-center justify-between px-6 pt-5 pb-4 flex-shrink-0 md:max-w-2xl md:mx-auto md:w-full'},
   h('img',{src:'logo-header.png',alt:'Inflexion',className:'h-8 w-auto',style:{filter:'brightness(10) saturate(0)'}}),
   h('button',{onClick:()=>setOpen(false),className:'w-11 h-11 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors','aria-label':'Fermer'},
    h('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.5,strokeLinecap:'round',className:'text-white'},h('path',{d:'M18 6L6 18M6 6l12 12'}))
   )
  ),

// ─── SOCIÉTÉS SUIVIES — l'instrument ─────────────────────────────────────────
// Catalogue : data/tracker/entreprises.json, validé par le modèle. Une coquille vide est un état normal.

function SocietesSuivies(){
const[etat,setEtat]=useState({phase:'chargement'})
useEffect(()=>{
fetch('data/tracker/entreprises.json',{cache:'no-store'})
.then(r=>{if(!r.ok)throw new Error('data/tracker/entreprises.json : HTTP '+r.status);return r.json()})
.then(catalogue=>{
const controle=TK.validerCatalogue(catalogue)
if(!controle.valide){setEtat({phase:'invalide',erreurs:controle.erreurs});return}
setEtat({phase:TK.etatCatalogue(catalogue)==='aucune-entreprise'?'vide':'ok',catalogue})
})
.catch(err=>setEtat({phase:'erreur',message:String(err&&err.message?err.message:err)}))
},[])
let corps
if(etat.phase==='chargement')corps=h('p',{className:'tk-note',style:{margin:0}},'Chargement du catalogue…')
else if(etat.phase==='invalide')corps=h('div',{className:'tk-vide'},
 h('p',{className:'tk-vide-titre'},'Catalogue non conforme au schéma'),
 h('p',{className:'tk-vide-precision'},etat.erreurs.join(' · ')))
else if(etat.phase==='erreur')corps=h('div',{className:'tk-vide'},
 h('p',{className:'tk-vide-titre'},'Données du tracker illisibles'),
 h('p',{className:'tk-vide-precision'},etat.message))
else if(etat.phase==='vide')corps=h('div',{className:'tk-vide'},
 h('p',{className:'tk-vide-titre'},'Aucune société suivie'),
 h('p',{className:'tk-vide-precision'},'Le tracker est en construction : aucune société n\'y est encore entrée. Les paramètres d\'une société — archétype, chiffre d\'affaires de la thèse, indicateur de demande — se fixent avant de lire ses chiffres, et ne changent plus ensuite.'))
else corps=h('div',{className:'tk-table-defile'},
 h('table',{className:'tk-table'},
  h('caption',null,'Sociétés suivies par le tracker d\'inflexions'),
  h('thead',null,h('tr',null,
   h('th',{scope:'col'},'Société'),
   h('th',{scope:'col'},'Archétype'),
   h('th',{scope:'col'},'Récit'),
   h('th',{scope:'col'},'Entrée'))),
  h('tbody',null,...etat.catalogue.entreprises.map(e=>
   h('tr',{key:e.id},
    h('th',{scope:'row'},h('a',{className:'tk-lien',href:'entreprise.html?id='+encodeURIComponent(e.id)},e.nom)),
    h('td',null,TK.TRACKER_ARCHETYPES[e.archetype].libelle),
    h('td',null,e.recit),
    h('td',{className:'tk-donnee'},e.entree_tracker))))
 ))
return h('section',{id:'societes',className:'py-20 md:py-24'},
 h('div',{className:'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8'},
  h(Reveal,{delay:0},h('p',{className:'kicker mb-3'},'§ L\'instrument — Sociétés suivies')),
  h(Reveal,{delay:0},h('h2',{className:'text-3xl md:text-[2.5rem] md:leading-[1.1] font-extrabold text-[#101214] mb-4'},'Les sociétés suivies')),
  h(Reveal,{delay:0.15},h('p',{className:'text-sm text-[#4C5052] max-w-2xl mb-8 leading-relaxed'},
   'Chaque société entre dans le tracker avec des paramètres fixés d\'avance. Chaque sens relevé porte la source du document qui l\'établit — 8-K, 10-Q, 10-K, communiqué.'
  )),
  h(Reveal,{delay:0.3},h('div',{className:'tk',style:{maxWidth:'none',padding:0}},corps))
 )
)
}
